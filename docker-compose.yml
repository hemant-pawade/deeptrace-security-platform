version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: deeptrace_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deeptrace_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deeptrace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deeptrace_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/deeptrace_db?schema=public"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in a .env file next to docker-compose.yml}"
      JWT_EXPIRES_IN: "8h"
      CORS_ORIGIN: "http://localhost:80"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deeptrace_frontend
    restart: always
    environment:
      VITE_API_URL: "/api"
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
