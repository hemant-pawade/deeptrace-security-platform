name: DeepTrace CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Security & API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: deeptrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Push Database Schema & Seed
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/deeptrace_test?schema=public"
        run: |
          npx prisma generate
          npx prisma db push
          node prisma/seed.js

      - name: Run Automated Security Test Suite
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/deeptrace_test?schema=public"
          JWT_SECRET: "ci_pipeline_secret_test_key"
        run: npm test

  frontend-build:
    name: Frontend Compilation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile & Build Vite Bundle
        working-directory: frontend
        run: npm run build
